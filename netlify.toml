# Netlify — https://app.netlify.com
# Same-origin /api/v1 is proxied to the Render FastAPI service.
# After Render finishes the first deploy, replace the host below if the
# service URL is not exactly https://sobralpsico-api.onrender.com.

[build]
  base = "frontend"
  command = "npm ci && npm run build:ci"
  publish = "dist/stephan"

[build.environment]
  NODE_VERSION = "18"
  NG_APP_API_URL = "/api/v1"

# Proxy API calls to Render so the browser stays same-origin (no CORS).
# Must sit above the Angular SPA catch-all.
[[redirects]]
  from = "/api/v1/*"
  to = "https://sobralpsico-api.onrender.com/api/v1/:splat"
  status = 200
  force = true

# HTML must revalidate. Hashed scripts and styles can stay cached.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/studio"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Angular SPA catch-all (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
