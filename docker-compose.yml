# Stephan — local development stack
version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./agents:/agents
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://stephan:stephan@db:5432/stephan
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Same engine as Lightsail: PostgreSQL on this machine, published only to localhost.
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: stephan
      POSTGRES_PASSWORD: stephan
      POSTGRES_DB: stephan
    volumes:
      - stephan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stephan -d stephan"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  stephan_pg:
